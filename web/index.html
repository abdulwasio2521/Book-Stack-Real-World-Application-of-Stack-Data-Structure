<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real World Application of the Stack Data Structure</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#5a3e5c;--card:#fff8fb;--pink:#ff8fb8;--mint:#6fcfb2;--sky:#8ecae6;--pw:330px}
html,body{height:100%;margin:0;background:#ffe9d6;font-family:Fredoka,system-ui,sans-serif;color:var(--ink);overflow:hidden}
#c{position:fixed;left:0;top:0;width:calc(100% - var(--pw));height:100%;display:block;touch-action:none;cursor:grab}
#hero{position:fixed;left:0;top:0;width:calc(100% - var(--pw));box-sizing:border-box;padding:10px 12px 18px;text-align:center;pointer-events:none;background:linear-gradient(rgba(255,244,236,.92),rgba(255,244,236,0))}
#hero h1{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:600;font-size:clamp(17px,2.1vw,30px);line-height:1.1;margin:0;letter-spacing:.01em;color:#4a2a4f}
#hero p{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(12px,1.1vw,15px);margin:3px 0 0;color:#8a5a7a}
#hero hr{width:70px;border:0;height:2px;background:linear-gradient(90deg,transparent,#c9a24d,transparent);margin:6px auto 0}
#ui{position:fixed;right:0;top:0;bottom:0;width:var(--pw);box-sizing:border-box;display:flex;flex-direction:column;background:var(--card);padding:14px;border-left:3px solid #fff;box-shadow:-6px 0 24px rgba(150,80,120,.2);overflow:hidden}
h2{font-size:18px;margin:0 0 8px}
label{font-size:12px;display:block;margin:7px 0 3px}
input,select{width:100%;box-sizing:border-box;font:inherit;padding:6px 9px;border-radius:12px;border:2px solid #f3c6da;background:#fff;color:var(--ink)}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{font:inherit;font-size:13px;border:2px solid #f3c6da;background:#fff;color:var(--ink);border-radius:12px;padding:5px 2px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
#bOver{width:100%;margin-top:6px;background:#c9a24d;padding:7px}
#sw{display:flex;gap:6px;flex-wrap:wrap}
#sw button{width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #f3c6da;cursor:pointer;padding:0}
#sw button.on{box-shadow:0 0 0 3px var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:8px 6px;color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,#sw button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#bPush{background:var(--mint)}#bPeek{background:#6fb3d9}#bUpd{background:#e2a43a}#bPop{background:var(--pink)}
#msg{min-height:34px;margin:10px 0 6px;font-size:13px;line-height:1.3}
#list{flex:1;min-height:0;overflow:auto;list-style:none;margin:0;padding:0;font-size:14px}
#list li{padding:5px 10px;border-radius:10px;margin-top:4px;background:#fff;border-left:10px solid;display:flex;justify-content:space-between;gap:8px}
#list li.top{background:#ffeaf3;font-weight:600}
#cnt{font-size:12px;margin-top:8px}
@media(max-width:780px){:root{--pw:100%}#c{width:100%;height:56%}#hero{width:100%}#hero p{display:none}#ui{top:auto;height:44%;border-left:0;overflow:auto}}
</style></head><body>
<canvas id="c"></canvas>

<label>Cover color</label><div id="sw"></div>
<label for="size">Size</label><select id="size"><option value="S">Small</option><option value="M" selected>Medium</option><option value="L">Large</option></select>
<div class="row">
<button class="btn" id="bPush">Push (Create)</button><button class="btn" id="bPeek">Peek (Read)</button>
<button class="btn" id="bUpd">Update top</button><button class="btn" id="bPop">Pop (Delete)</button>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<ul id="list"></ul><div id="cnt"></div>
</div>

function coverTex(b){
  const cw=512,ch=Math.round(512*b.d/b.w),c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
  x.fillStyle=b.color;x.fillRect(0,0,cw,ch);
  x.strokeStyle='#fff';x.lineWidth=8;x.setLineDash([16,12]);x.strokeRect(22,22,cw-44,ch-44);x.setLineDash([]);
  x.textAlign='center';x.font='600 46px Fredoka,sans-serif';
  const words=b.title.split(' '),lines=[];let cur='';
  words.forEach(w=>{const t=cur?cur+' '+w:w;if(x.measureText(t).width>cw-150&&cur){lines.push(cur);cur=w}else cur=t});lines.push(cur);
  const lh=54,bh=lines.length*lh+24,by=50;
  x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.roundRect?x.roundRect(50,by,cw-100,bh,26):x.rect(50,by,cw-100,bh);x.fill();
  x.fillStyle='#5a3e5c';lines.forEach((l,i)=>x.fillText(l,cw/2,by+12+lh*(i+.8)));
  const fx=cw/2,fy=Math.max(by+bh+(ch-by-bh)*.5,ch*.66);
  x.strokeStyle='#5a3e5c';x.fillStyle='#5a3e5c';x.lineWidth=7;x.lineCap='round';
  if(b.face===0){[-48,48].forEach(o=>{x.beginPath();x.arc(fx+o,fy,10,0,7);x.fill()})}
  else if(b.face===1){[-48,48].forEach(o=>{x.beginPath();x.arc(fx+o,fy+6,14,Math.PI*1.1,Math.PI*1.9);x.stroke()})}
  else{x.font='40px sans-serif';x.fillText('★',fx-48,fy+12);x.fillText('★',fx+48,fy+12)}
  x.beginPath();x.arc(fx,fy+16,20,.15*Math.PI,.85*Math.PI);x.stroke();
  x.fillStyle='rgba(255,90,130,.45)';[-82,82].forEach(o=>{x.beginPath();x.ellipse(fx+o,fy+16,16,10,0,0,7);x.fill()});
  x.fillStyle='#fff';x.font='44px sans-serif';
  if(b.deco===0)x.fillText('★',cw-62,ch-44);else if(b.deco===1)x.fillText('♥',cw-62,ch-44);
  else{x.fillRect(36,ch-70,cw-72,10);x.fillRect(36,ch-52,cw-72,10)}
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function build(b,si){
  const g=new THREE.Group(),{w,d,t}=b,cvr=.04,cm=M(b.color,.55);
  const tp=new THREE.MeshStandardMaterial({map:coverTex(b),roughness:.5});

  part(new THREE.BoxGeometry(w,cvr,d),[cm,cm,tp,cm,cm,cm],0,t/2-cvr/2,0);
  part(new THREE.BoxGeometry(w,cvr,d),cm,0,-t/2+cvr/2,0);
  part(new THREE.BoxGeometry(w-.08,t-2*cvr,d-.08),M('#fff4dc',.9),.03,0,0);

async function update(){const k=SK[active],tt=$('title').value.trim();
  if(!tt){say('Type a new title first, then press Update top.');return}

  $('cnt').textContent=k.n+': '+k.items.length+' of '+MAX+(k.items.length?'':' · empty')}

SK.forEach((k,i)=>{const b=document.createElement('button');b.className='tab';b.onclick=()=>select(i);$('tabs').appendChild(b)});
PAL.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Color '+(i+1));if(!i)b.className='on';
  b.onclick=()=>{color=c;[...$('sw').children].forEach(x=>x.className='');b.className='on'};$('sw').appendChild(b)});
$('bPush').onclick=()=>{push($('title').value.trim());$('title').value=''};
$('bPeek').onclick=peek;$('bPop').onclick=pop;$('bUpd').onclick=update;
$('bOver').onclick=()=>{flyTo(0,2,0,15,1.0);say('Showing the whole table.')};

// ---------- camera orbit + click to focus ----------
const rc=new THREE.Raycaster(),mv=new THREE.Vector2();
function place(){cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt)}
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];down=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;th-=(e.clientX-drag[0])*.008;ph=Math.min(1.5,Math.max(.4,ph-(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{const moved=down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])>5;drag=null;if(moved)return;
  const rt=cv.getBoundingClientRect();mv.set((e.clientX-rt.left)/rt.width*2-1,-((e.clientY-rt.top)/rt.height)*2+1);rc.setFromCamera(mv,cam);
  for(const h of rc.intersectObjects(S.children,true)){let o=h.object;while(o&&o.userData.sk===undefined)o=o.parent;if(o){select(o.userData.sk);return}}});
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(17,Math.max(4,rad+e.deltaY*.012))},{passive:false});
function resize(){R.setSize(cv.clientWidth,cv.clientHeight,false);cam.aspect=cv.clientWidth/cv.clientHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

(function loop(now){
  for(let i=tw.length-1;i>=0;i--){const a=tw[i],p=Math.min(1,(now-a.t0)/a.dur);a.fn(p);if(p>=1){tw.splice(i,1);a.done&&a.done()}}
  spk.rotation.y=now*.00003;spk.position.y=Math.sin(now*.001)*.15;
  animateDecor(now);place();R.render(S,cam);requestAnimationFrame(loop)})(performance.now());

async function load(){render();try{const all=await api('/api/stacks');all.forEach((arr,si)=>arr.forEach((b,i)=>setTimeout(()=>addMesh(si,b),400+i*450)));say('Welcome! Click any stack to step up to it.')}
  catch(e){say('Cannot reach the Java server. Start it, then open http://localhost:8080')}}
load();
</script></body></html>
